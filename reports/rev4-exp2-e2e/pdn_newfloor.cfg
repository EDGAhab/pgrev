# rev4-exp2: recovered stdcell spec (VERBATIM from
# data/sky130hd_gcd_unlabeled/pdn_inferred.cfg, WS1 unlabeled pipeline)
# + a designer-added macro grid section (floorplan-specific, NOT inferred:
# the original design had no macro, so no macro rule exists in the geometry).
# It carries no stripe geometry -- only blockage layers + halo for the new macro.
set ::stripes_start_with "POWER" ;
set ::power_nets "VDD"
set ::ground_nets "VSS"

pdngen::specify_grid stdcell {
    name grid
    rails {
        met1 {width 0.480}
    }
    straps {
        met4 {width 1.600 pitch 27.140 offset 13.570}
        met5 {width 1.600 pitch 27.200 offset 13.600}
    }
    connect {{met1 met4} {met4 met5}}
}

pdngen::specify_grid macro {
    orient {R0 R180 MX MY}
    blockages "met4 met5"
    # NOTE (legacy-script quirk): specify_grid does NOT micron->dbu convert
    # the halo (define_pdn_grid does); pass dbu directly. 2um = 2000 dbu.
    # With halo {2 2 2 2} (microns as raw numbers) the effective halo was
    # 2 dbu ~ 0 and the y-cut landed 0.24um INSIDE the macro (rail_width/2
    # term in set_instance_halo). dbu values give the intended 2um halo.
    halo {2000 2000 2000 2000}
}
